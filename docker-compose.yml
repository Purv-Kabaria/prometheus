services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    # This entrypoint starts the ollama server in the background, 
    # and then continuously attempts to pull the model until successful, 
    # preventing the container from crashing if a network timeout occurs.
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "ollama serve & sleep 5 && (while ! ollama pull qwen2.5:3b; do echo 'Pull failed, retrying in 10s...'; sleep 10; done) & wait" ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

volumes:
  ollama_data:
