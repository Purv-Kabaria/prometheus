

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    # Volume map the database so proposals persist across backend container restarts
    volumes:
      - ./backend/proposals_db.json:/app/proposals_db.json

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    # This entrypoint starts the ollama server in the background, 
    # and then continuously attempts to pull the model until successful, 
    # preventing the container from crashing if a network timeout occurs.
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "ollama serve & sleep 5 && (while ! ollama pull qwen2.5:3b; do echo 'Pull failed, retrying in 10s...'; sleep 10; done) & wait" ]

volumes:
  ollama_data: